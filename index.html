<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Supreme Scholar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0c0b0a;--surface:#161310;--fg:#f3eadc;--muted:#a89880;--gold:#c4a265;--line:#3a3228}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:Outfit,system-ui,sans-serif}button,label.file{cursor:pointer;font:inherit}button{font:inherit}
.wrap{max-width:72rem;margin:0 auto;padding:1rem;display:grid;gap:1.5rem}
@media(min-width:960px){.wrap{grid-template-columns:18rem 1fr;padding:2rem}aside{position:sticky;top:1.5rem;align-self:start}}
aside,form,.card{background:var(--surface);border:1px solid var(--line);border-radius:1rem}aside{padding:1.25rem;display:flex;flex-direction:column;gap:1.25rem}
.kicker{margin:0;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-size:.75rem;font-weight:600}
label{display:block;color:var(--muted);font-size:.875rem}input,select{width:100%;margin-top:.35rem;padding:.55rem .75rem;border-radius:.6rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.rank{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:2.6rem;line-height:1;color:var(--gold)}
.bar{height:.5rem;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:1rem}.bar>span{display:block;height:100%;background:var(--gold)}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.25rem;font-size:.875rem}ol li{display:flex;justify-content:space-between}.on{color:var(--fg)}.off{color:var(--muted)}
.note{margin:0;color:var(--muted);font-size:.75rem;line-height:1.5}.stack{display:flex;flex-direction:column;gap:.5rem}
.ghost,.solid,label.file{min-height:2.75rem;border-radius:.6rem;display:inline-flex;align-items:center;justify-content:center}
.ghost,label.file{background:transparent;color:var(--fg);border:1px solid var(--line);padding:0 .8rem}.solid{background:var(--gold);color:var(--bg);border:0;font-weight:600;padding:0 .9rem}
h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:2rem} .lede{margin:.35rem 0 0;color:var(--muted);font-size:.875rem}
form{padding:1rem;display:grid;gap:.75rem}@media(min-width:640px){form{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.filters{display:flex;flex-wrap:wrap;gap:.5rem}.chip{min-height:2.75rem;border-radius:999px;padding:0 1rem;border:1px solid var(--line);background:transparent;color:var(--muted)}.chip.active{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.75rem}.card{padding:1rem}.row{display:flex;justify-content:space-between;gap:.75rem}.done{color:var(--muted);text-decoration:line-through}.meta{margin:.5rem 0 0;color:var(--muted);font-size:.75rem}.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
.empty{border:1px dashed var(--line);border-radius:1rem;padding:2rem;text-align:center;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main class="wrap">
<aside>
<p class="kicker">Supreme Scholar</p>
<label>Your name<input id="name" placeholder="Write your name here" autocomplete="name"/></label>
<div><p class="rank" id="rank">Foundation</p><p class="note" id="rank-line"></p><div class="bar"><span id="bar"></span></div><p id="xp-line">0 XP earned</p></div>
<ol id="ladder"></ol>
<p class="note">Easy 25 · Medium 60 · Hard 120 · Boss 250. Everything stays in this browser. Export a JSON file when you want a copy you can keep.</p>
<div class="stack"><button class="ghost" id="export" type="button">Export JSON</button><label class="file">Import JSON<input id="import" class="sr" type="file" accept="application/json,.json"/></label><p class="note" id="notice" hidden></p></div>
</aside>
<section>
<h1>Missions</h1>
<p class="lede">Open this file and use it. Rank and cards stay in this browser until you clear site data.</p>
<form id="add-form">
<label class="span2">Title<input id="title" placeholder="What must be finished" required/></label>
<label>Type<select id="type"><option>mission</option><option>exam</option><option>step</option><option>deadline</option></select></label>
<label>Difficulty<select id="difficulty"><option value="easy">easy · 25 XP</option><option value="medium" selected>medium · 60 XP</option><option value="hard">hard · 120 XP</option><option value="boss">boss · 250 XP</option></select></label>
<label>Deadline<input id="deadline" type="date"/></label>
<div style="display:flex;align-items:end"><button class="solid" type="submit" style="width:100%">Add</button></div>
</form>
<div class="filters" id="filters"></div>
<div id="list"></div>
</section>
</main>
<script>
const LEVELS=[{name:"Foundation",min:0},{name:"Mortal",min:120},{name:"Scholar",min:360},{name:"Adept",min:800},{name:"Master",min:1600},{name:"Transcendent",min:2800},{name:"Supreme",min:4500}];
const XP={easy:25,medium:60,hard:120,boss:250};
const KEY="supreme-scholar-v2";
const KIND="supreme-scholar-backup";
const FILTERS=[["all","All"],["mission","Missions"],["exam","Exams"],["step","Steps"],["deadline","Deadlines"]];
let filter="all";
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function shift(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function seed(){return{displayName:"",missions:[
{id:"m1",title:"Read one chapter and write five lines",description:"Any subject. Finish the page, not the feed.",type:"mission",difficulty:"easy",deadline:null,status:"pending"},
{id:"m2",title:"Chemistry mock \u2014 30 questions",description:"Timed. Mark only what you can defend.",type:"exam",difficulty:"hard",deadline:shift(2),status:"in_progress"},
{id:"m3",title:"Outline the next study block",description:"Three steps, one sitting.",type:"step",difficulty:"medium",deadline:null,status:"pending"},
{id:"m4",title:"Submit the late sheet",description:"This one already slipped. Clear it or it stays overdue.",type:"deadline",difficulty:"boss",deadline:shift(-1),status:"pending"}
]}}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return seed();const p=JSON.parse(raw);if(!p||!Array.isArray(p.missions))return seed();return p}catch(e){return seed()}}
let state=load();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function xpOf(m){return XP[m.difficulty]||0}
function total(){return state.missions.filter(m=>m.status==="completed").reduce((n,m)=>n+xpOf(m),0)}
function rankOf(xp){let current=LEVELS[0],next=LEVELS[1],index=0;LEVELS.forEach((level,i)=>{if(xp>=level.min){current=level;next=LEVELS[i+1]||null;index=i}});const span=next?next.min-current.min:1;const pct=next?Math.round(Math.min(xp-current.min,span)/span*100):100;return{current,next,pct,index}}
function late(m){return m.status!=="completed"&&m.deadline&&m.deadline<today()}
function note(t){const el=document.getElementById("notice");el.hidden=!t;el.textContent=t||""}
function esc(s){const amp=String.fromCharCode(38);return String(s).replace(/[&<>"']/g,(c)=>{if(c===amp)return amp+"amp;";if(c==="<")return amp+"lt;";if(c===">")return amp+"gt;";if(c==='"')return amp+"quot;";return amp+"#39;"})}
function fromBackup(raw){if(!raw||raw.kind!==KIND||!Array.isArray(raw.missions))throw new Error("That file is not a Scholar backup.");const okT=["mission","exam","step","deadline"],okD=["easy","medium","hard","boss"],okS=["pending","in_progress","completed"];return{displayName:typeof raw.displayName==="string"?raw.displayName:"",missions:raw.missions.filter(r=>r&&typeof r.title==="string"&&r.title.trim()).map(r=>({id:typeof r.id==="string"&&r.id?r.id:crypto.randomUUID(),title:r.title.trim(),description:typeof r.description==="string"?r.description:"",type:okT.includes(r.type)?r.type:"mission",difficulty:okD.includes(r.difficulty)?r.difficulty:"medium",deadline:typeof r.deadline==="string"&&r.deadline?r.deadline:null,status:okS.includes(r.status)?r.status:"pending"}))}}
function render(){const xp=total(),rank=rankOf(xp);document.getElementById("name").value=state.displayName||"";document.getElementById("rank").textContent=rank.current.name;document.getElementById("rank-line").textContent="Rank "+(rank.index+1)+" of "+LEVELS.length+(rank.next?" \u00b7 next "+rank.next.name+" at "+rank.next.min+" XP":" \u00b7 peak");document.getElementById("bar").style.width=rank.pct+"%";document.getElementById("xp-line").textContent=xp+" XP earned";document.getElementById("ladder").innerHTML=LEVELS.map((l,i)=>'<li class="'+(i<=rank.index?"on":"off")+'"><span>'+l.name+"</span><span>"+l.min+"</span></li>").join("");document.getElementById("filters").innerHTML=FILTERS.map(([id,label])=>'<button type="button" class="chip'+(filter===id?" active":"")+'" data-filter="'+id+'">'+label+"</button>").join("");const visible=state.missions.filter(m=>filter==="all"||m.type===filter);const list=document.getElementById("list");if(!visible.length){list.innerHTML='<p class="empty">Nothing in this lane. Add one above.</p>';return}list.innerHTML='<ul>'+visible.map(m=>{const actions=m.status==="completed"?'<button type="button" class="ghost" data-act="pending" data-id="'+m.id+'">Undo</button>':(m.status==="pending"?'<button type="button" class="ghost" data-act="in_progress" data-id="'+m.id+'">Start</button>':"")+'<button type="button" class="solid" data-act="completed" data-id="'+m.id+'">Done \u00b7 +'+xpOf(m)+"</button>";return '<li class="card"><div class="row"><div><p class="'+(m.status==="completed"?"done":"")+'">'+esc(m.title)+"</p>"+(m.description?'<p class="meta">'+esc(m.description)+"</p>":"")+'<p class="meta">'+m.type+" \u00b7 "+m.difficulty+" \u00b7 "+xpOf(m)+" XP"+(m.deadline?" \u00b7 due "+m.deadline:"")+(late(m)?" \u00b7 overdue":"")+(m.status==="in_progress"?" \u00b7 in progress":"")+"</p></div><button type=\"button\" class=\"ghost\" data-act=\"remove\" data-id=\""+m.id+"\">Remove</button></div><div class=\"actions\">'+actions+"</div></li>"}).join("")+"</ul>"}
document.getElementById("name").addEventListener("input",e=>{state.displayName=e.target.value;save()});
document.getElementById("add-form").addEventListener("submit",e=>{e.preventDefault();const title=document.getElementById("title").value.trim();if(!title)return;const deadline=document.getElementById("deadline").value;state.missions.unshift({id:crypto.randomUUID(),title,description:"",type:document.getElementById("type").value,difficulty:document.getElementById("difficulty").value,deadline:deadline||null,status:"pending"});document.getElementById("title").value="";document.getElementById("deadline").value="";save();render()});
document.getElementById("filters").addEventListener("click",e=>{const id=e.target.getAttribute("data-filter");if(!id)return;filter=id;render()});
document.getElementById("list").addEventListener("click",e=>{const btn=e.target.closest("[data-act]");if(!btn)return;const id=btn.getAttribute("data-id"),act=btn.getAttribute("data-act");if(act==="remove")state.missions=state.missions.filter(m=>m.id!==id);else state.missions=state.missions.map(m=>m.id===id?Object.assign({},m,{status:act}):m);save();render()});
document.getElementById("export").addEventListener("click",()=>{const blob=new Blob([JSON.stringify({kind:KIND,version:1,exportedAt:new Date().toISOString(),displayName:state.displayName,missions:state.missions},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="supreme-scholar-backup.json";a.click();URL.revokeObjectURL(url);note("Backup file saved. Keep it anywhere you like.")});
document.getElementById("import").addEventListener("change",async e=>{const file=e.target.files&&e.target.files[0];e.target.value="";if(!file)return;try{state=fromBackup(JSON.parse(await file.text()));save();render();note("Restored "+state.missions.length+" cards from that file.")}catch(err){note(err&&err.message?err.message:"Could not read that file.")}});
render();
</script>
</body>
</html>
